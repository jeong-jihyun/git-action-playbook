<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="450" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">merge: 갈라진 두 길을 하나로 합치기</text>

  <!-- before -->
  <text x="30" y="75" font-size="14" font-weight="700" fill="#64748b">합치기 전</text>
  <g stroke="#475569" stroke-width="3" fill="none">
    <line x1="90" y1="110" x2="150" y2="110"/>
    <line x1="150" y1="110" x2="210" y2="110"/>
    <path d="M150 110 L190 165 L250 165"/>
    <line x1="250" y1="165" x2="310" y2="165"/>
  </g>
  <g fill="#3b82f6"><circle cx="90" cy="110" r="14"/><circle cx="150" cy="110" r="14"/><circle cx="210" cy="110" r="14"/></g>
  <g fill="#f59e0b"><circle cx="250" cy="165" r="14"/><circle cx="310" cy="165" r="14"/></g>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="90" y="115">A</text><text x="150" y="115">B</text><text x="210" y="115">E</text>
    <text x="250" y="170">C</text><text x="310" y="170">D</text>
  </g>
  <text x="240" y="85" font-size="13" fill="#1d4ed8" font-weight="700">main</text>
  <text x="332" y="170" font-size="13" fill="#b45309" font-weight="700">feature/login</text>

  <!-- arrow -->
  <text x="450" y="205" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">git switch main → git merge feature/login</text>
  <path d="M370 215 L530 215" stroke="#475569" stroke-width="3" fill="none"/>
  <path d="M525 208 L540 215 L525 222z" fill="#475569"/>

  <!-- after -->
  <text x="30" y="255" font-size="14" font-weight="700" fill="#64748b">합친 후</text>
  <g stroke="#475569" stroke-width="3" fill="none">
    <line x1="90" y1="290" x2="150" y2="290"/>
    <line x1="150" y1="290" x2="210" y2="290"/>
    <line x1="210" y1="290" x2="390" y2="290"/>
    <path d="M150 290 L190 250 L250 250"/>
    <line x1="250" y1="250" x2="310" y2="250"/>
    <path d="M310 250 L390 290"/>
  </g>
  <g fill="#3b82f6"><circle cx="90" cy="290" r="14"/><circle cx="150" cy="290" r="14"/><circle cx="210" cy="290" r="14"/></g>
  <g fill="#f59e0b"><circle cx="250" cy="250" r="14"/><circle cx="310" cy="250" r="14"/></g>
  <circle cx="390" cy="290" r="17" fill="#22c55e"/>
  <g font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <text x="90" y="295">A</text><text x="150" y="295">B</text><text x="210" y="295">E</text>
    <text x="250" y="255">C</text><text x="310" y="255">D</text><text x="390" y="295">M</text>
  </g>
  <text x="420" y="295" font-size="14" fill="#15803d" font-weight="700">← 합친 커밋(M)이 새로 생김</text>

  <!-- note -->
  <g font-size="13" fill="#334155">
    <text x="600" y="75" font-weight="700">기억할 것</text>
    <text x="600" y="100">• merge는 "내가 있는 브랜치"로 합쳐집니다</text>
    <text x="600" y="122">• 그래서 받는 쪽(main)으로 먼저 이동!</text>
    <text x="600" y="144">• 두 길을 이어 붙여서 기록이 Y자로 남음</text>
  </g>
</svg>
