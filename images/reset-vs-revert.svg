<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="900" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <line x1="450" y1="20" x2="450" y2="310" stroke="#cbd5e1" stroke-dasharray="5 5"/>

  <!-- reset -->
  <text x="225" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">reset: 기록을 지움 (push 전)</text>
  <g stroke="#475569" stroke-width="3"><line x1="60" y1="110" x2="310" y2="110"/></g>
  <g fill="#3b82f6"><circle cx="60" cy="110" r="15"/><circle cx="140" cy="110" r="15"/><circle cx="220" cy="110" r="15"/></g>
  <circle cx="310" cy="110" r="15" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff"><text x="60" y="115">A</text><text x="140" y="115">B</text><text x="220" y="115">C</text></g>
  <text x="310" y="115" font-size="13" font-weight="700" text-anchor="middle" fill="#b91c1c">D</text>
  <path d="M290 98 L330 122 M330 98 L290 122" stroke="#ef4444" stroke-width="2.5"/>
  <text x="220" y="75" font-size="12" text-anchor="middle" fill="#1d4ed8" font-weight="700">HEAD가 여기로 이동</text>
  <text x="225" y="170" font-size="14" text-anchor="middle" fill="#334155" font-weight="700">git reset --hard HEAD~1</text>
  <text x="225" y="196" font-size="13" text-anchor="middle" fill="#475569">비유: 연필로 쓴 걸 지우개로 지움</text>
  <text x="225" y="222" font-size="13" text-anchor="middle" fill="#475569">이미 남이 받아갔다면 기록이 어긋나서 꼬임</text>
  <rect x="85" y="245" width="280" height="40" rx="8" fill="#fee2e2" stroke="#ef4444"/>
  <text x="225" y="270" font-size="14" text-anchor="middle" fill="#b91c1c" font-weight="700">push 전에만 사용</text>

  <!-- revert -->
  <text x="675" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">revert: 취소 기록을 추가 (push 후)</text>
  <g stroke="#475569" stroke-width="3"><line x1="510" y1="110" x2="830" y2="110"/></g>
  <g fill="#3b82f6"><circle cx="510" cy="110" r="15"/><circle cx="590" cy="110" r="15"/><circle cx="670" cy="110" r="15"/><circle cx="750" cy="110" r="15"/></g>
  <circle cx="830" cy="110" r="15" fill="#22c55e"/>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff"><text x="510" y="115">A</text><text x="590" y="115">B</text><text x="670" y="115">C</text><text x="750" y="115">D</text><text x="830" y="115">D'</text></g>
  <text x="830" y="75" font-size="12" text-anchor="middle" fill="#15803d" font-weight="700">D를 취소하는 새 커밋</text>
  <text x="675" y="170" font-size="14" text-anchor="middle" fill="#334155" font-weight="700">git revert D</text>
  <text x="675" y="196" font-size="13" text-anchor="middle" fill="#475569">비유: 틀린 장부에 정정 전표를 추가로 씀</text>
  <text x="675" y="222" font-size="13" text-anchor="middle" fill="#475569">기록이 남아서 팀원과 꼬이지 않음</text>
  <rect x="535" y="245" width="280" height="40" rx="8" fill="#dcfce7" stroke="#22c55e"/>
  <text x="675" y="270" font-size="14" text-anchor="middle" fill="#15803d" font-weight="700">push 후에는 이것만 사용</text>
</svg>
